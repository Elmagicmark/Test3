workflows:
  android-apk-build:
    name: Build InterceptX Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location & Decode Keystore
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || openssl base64 -d -in debug.keystore.base64 -out debug.keystore
          fi
      - name: Build Debug APK
        script: |
          gradle :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - eslamevreno123@gmail.com
        notify:
          success: true
          failure: true
